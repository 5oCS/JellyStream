name: build

# Builds run on every push to the testing branch (pre-release validation
# builds) and on main (the release branch). Actual releases are only
# published by release.yml when a v* tag lands on main.
on:
  push:
    branches: [main, testing]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/fetch-references.sh
      - run: bash scripts/build.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Jellystream-${{ github.ref_name }}
          path: artifacts/Jellystream-*.zip
